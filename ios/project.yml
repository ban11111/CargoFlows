name: CargoFlow
options:
  bundleIdPrefix: com.cargoflow
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  CargoFlow:
    type: application
    platform: iOS
    sources:
      - CargoFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cargoflow.app
        INFOPLIST_FILE: CargoFlow/Info.plist
    info:
      path: CargoFlow/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCameraUsageDescription: CargoFlow needs camera access to capture required product views.
  CargoFlowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CargoFlowTests
    dependencies:
      - target: CargoFlow
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  CargoFlow:
    build:
      targets:
        CargoFlow: all
    test:
      targets:
        - CargoFlowTests
