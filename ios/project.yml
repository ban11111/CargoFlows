name: CargoFlow
options:
  bundleIdPrefix: com.cargoflow
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  CargoFlow:
    type: application
    platform: iOS
    sources:
      - CargoFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cargoflow.app
        INFOPLIST_FILE: CargoFlow/Info.plist
    info:
      path: CargoFlow/Info.plist

