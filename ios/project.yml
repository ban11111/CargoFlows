name: CargoFlows
options:
  bundleIdPrefix: com.cargoflows
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  CargoFlows:
    type: application
    platform: iOS
    sources:
      - CargoFlows
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cargoflows.app
        INFOPLIST_FILE: CargoFlows/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: XDUSZQ42JP
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CARGOFLOWS_API_BASE_URL: "https://dev.cargoflows.cc/api/proxy/"
    info:
      path: CargoFlows/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCameraUsageDescription: CargoFlows needs camera access to capture required product views.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CargoFlowsAPIBaseURL: $(CARGOFLOWS_API_BASE_URL)
  CargoFlowsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CargoFlowsTests
    dependencies:
      - target: CargoFlows
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  CargoFlows:
    build:
      targets:
        CargoFlows: all
    test:
      targets:
        - CargoFlowsTests
