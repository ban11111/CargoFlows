name: CargoFlow
options:
  bundleIdPrefix: com.cargoflow
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  CargoFlow:
    type: application
    platform: iOS
    sources:
      - CargoFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cargoflow.app
        INFOPLIST_FILE: CargoFlow/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: XDUSZQ42JP
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CARGOFLOW_API_BASE_URL: "https://dev.cargoflows.cc/api/proxy/"
    info:
      path: CargoFlow/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCameraUsageDescription: CargoFlow needs camera access to capture required product views.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CargoFlowAPIBaseURL: $(CARGOFLOW_API_BASE_URL)
  CargoFlowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CargoFlowTests
    dependencies:
      - target: CargoFlow
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  CargoFlow:
    build:
      targets:
        CargoFlow: all
    test:
      targets:
        - CargoFlowTests
