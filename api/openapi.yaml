        - { in: query, name: created_by, schema: { type: string }, description: Case-insensitive filter by immutable creator name, email, or public ID snapshot. }
        - { in: query, name: model, schema: { type: string }, description: Filter by a model recorded in the job snapshot. }
        - { in: query, name: api_mode, schema: { type: string, enum: [responses, images] }, description: Filter by configured image API mode. }
      responses:
        '200': { description: AI jobs in newest-first order, content: { application/json: { schema: { type: object, additionalProperties: false, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/AIJob' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      operationId: createAIJob
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateAIJobRequest' } } }
      responses:
        '200': { description: Idempotent replay of the existing AI job, content: { application/json: { schema: { $ref: '#/components/schemas/AIJob' } } } }
        '201': { description: Reproducible AI content job, content: { application/json: { schema: { $ref: '#/components/schemas/AIJob' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { description: Selected SKU, SOP, slots, or assets are not eligible, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /ai-jobs/{job_id}:
    parameters: [ { $ref: '#/components/parameters/AIJobID' } ]
    get:
      operationId: getAIJob
      responses:
        '200': { description: AI job, content: { application/json: { schema: { $ref: '#/components/schemas/AIJob' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /ai-jobs/{job_id}/text-results:
    parameters: [ { $ref: '#/components/parameters/AIJobID' } ]
    get:
      operationId: listAITextResults
      responses:
        '200': { description: Safe AI text candidates, content: { application/json: { schema: { type: object, additionalProperties: false, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/AITextResult' } } } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /ai-jobs/{job_id}/image-results:
    parameters: [ { $ref: '#/components/parameters/AIJobID' } ]
    get:
      operationId: listAIImageResults
      responses:
        '200': { description: Safe AI image candidates, content: { application/json: { schema: { type: object, additionalProperties: false, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/AIImageResult' } } } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /ai-jobs/{job_id}/image-threads:
    parameters: [ { $ref: '#/components/parameters/AIJobID' } ]
    get:
      operationId: listAIImageThreads
      responses:
        '200': { description: Permanent version history grouped by output slot, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/AIImageThread' } } } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /ai-jobs/{job_id}/items/{item_id}/image-turns:
    parameters: [ { $ref: '#/components/parameters/AIJobID' }, { $ref: '#/components/parameters/AIJobItemID' } ]
    post:
      operationId: createAIImageTurn
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CreateAIImageTurnRequest' } }
          multipart/form-data:
            schema:
              allOf:
                - { $ref: '#/components/schemas/CreateAIImageTurnRequest' }
                - { type: object, properties: { mask: { type: string, format: binary } } }
      responses:
        '202': { description: Queued one-image edit or restart turn, content: { application/json: { schema: { $ref: '#/components/schemas/AIImageTurn' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { description: Parent or mask is invalid, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /ai-jobs/{job_id}/items/{item_id}/image-results/{result_id}/select:
    parameters: [ { $ref: '#/components/parameters/AIJobID' }, { $ref: '#/components/parameters/AIJobItemID' }, { $ref: '#/components/parameters/AIImageResultID' } ]
    post:
      operationId: selectAIImageResult
      responses:
        '200': { description: Selected final version for this slot, content: { application/json: { schema: { type: object, required: [selected_result_id], properties: { selected_result_id: { type: string, format: uuid } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /ai-jobs/{job_id}/items/{item_id}/image-results/{result_id}/submit-to-assets:
    parameters: [ { $ref: '#/components/parameters/AIJobID' }, { $ref: '#/components/parameters/AIJobItemID' }, { $ref: '#/components/parameters/AIImageResultID' } ]
    post:
      operationId: submitAIImageResultToAssets
      responses:
        '200': { description: Idempotent replay of an existing asset submission, content: { application/json: { schema: { $ref: '#/components/schemas/SubmittedAIAsset' } } } }
        '201': { description: Pending AI-generated asset, content: { application/json: { schema: { $ref: '#/components/schemas/SubmittedAIAsset' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Only the selected version can be submitted, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /style-reference-grants:
    get:
      operationId: listStyleReferenceGrants
      responses:
        '200': { description: Approved style-only private derivatives, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/StyleReferenceGrant' } } } } } } }
    post:
      operationId: createStyleReferenceGrant
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [asset_id, description_zh, description_en, product_exclusion_mask]
              properties:
                asset_id: { type: string, format: uuid }
                description_zh: { type: string, maxLength: 2000 }
                description_en: { type: string, maxLength: 2000 }
                product_exclusion_mask: { type: string, format: binary, description: Transparent pixels cover the source product to remove. }
      responses:
        '201': { description: Administrator-approved style derivative, content: { application/json: { schema: { $ref: '#/components/schemas/StyleReferenceGrant' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Source asset is not eligible, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /style-reference-grants/{grant_id}:
    parameters: [ { in: path, name: grant_id, required: true, schema: { type: string, format: uuid } } ]
    patch:
      operationId: revokeStyleReferenceGrant
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RevokeReferenceRequest' } } } }
      responses:
        '200': { description: Revoked for future jobs; historical snapshots remain executable., content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /ai-jobs/{job_id}/image-results/{result_id}/media:
    parameters: [ { $ref: '#/components/parameters/AIJobID' }, { $ref: '#/components/parameters/AIImageResultID' } ]
    get:
      operationId: getAIImageResultMedia
      responses:
        '200': { description: Private generated image bytes, content: { image/png: { schema: { type: string, format: binary } }, image/jpeg: { schema: { type: string, format: binary } }, image/webp: { schema: { type: string, format: binary } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { description: Generated-image storage unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /ai-jobs/{job_id}/items/{item_id}/text-results/{result_id}:
    parameters: [ { $ref: '#/components/parameters/AIJobID' }, { $ref: '#/components/parameters/AIJobItemID' }, { $ref: '#/components/parameters/AITextResultID' } ]
    patch:
      operationId: editAITextResult
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EditAITextResultRequest' } } } }
      responses:
        '200': { description: Edited candidate, content: { application/json: { schema: { $ref: '#/components/schemas/AITextResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { description: Candidate validation failed, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /ai-jobs/{job_id}/items/{item_id}/text-results/{result_id}/approve:
    parameters: [ { $ref: '#/components/parameters/AIJobID' }, { $ref: '#/components/parameters/AIJobItemID' }, { $ref: '#/components/parameters/AITextResultID' } ]
    post:
      operationId: approveAITextResult
      responses:
        '200': { description: Approved candidate, content: { application/json: { schema: { $ref: '#/components/schemas/AITextResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { description: Candidate validation failed, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /ai-jobs/{job_id}/items/{item_id}/text-results/{result_id}/reject:
    parameters: [ { $ref: '#/components/parameters/AIJobID' }, { $ref: '#/components/parameters/AIJobItemID' }, { $ref: '#/components/parameters/AITextResultID' } ]
    post:
      operationId: rejectAITextResult
      responses:
        '200': { description: Rejected candidate, content: { application/json: { schema: { $ref: '#/components/schemas/AITextResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /ai-jobs/{job_id}/items/{item_id}/text-results/{result_id}/application-preview:
    parameters: [ { $ref: '#/components/parameters/AIJobID' }, { $ref: '#/components/parameters/AIJobItemID' }, { $ref: '#/components/parameters/AITextResultID' } ]
    get:
      operationId: previewAITextResultApplication
      responses:
        '200': { description: Explicit before/after application preview, content: { application/json: { schema: { $ref: '#/components/schemas/AITextApplicationPreview' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { description: Candidate validation failed, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /ai-jobs/{job_id}/items/{item_id}/text-results/{result_id}/apply:
    parameters: [ { $ref: '#/components/parameters/AIJobID' }, { $ref: '#/components/parameters/AIJobItemID' }, { $ref: '#/components/parameters/AITextResultID' } ]
    post:
      operationId: applyAITextResult
      responses:
        '200': { description: Explicitly applied candidate, content: { application/json: { schema: { $ref: '#/components/schemas/AITextApplicationResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { description: Candidate validation failed, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /skus/{sku_id}/platform-content:
    parameters: [ { $ref: '#/components/parameters/SKUID' }, { in: query, name: platform, required: true, schema: { type: string, minLength: 1, maxLength: 80 } }, { in: query, name: locale, required: true, schema: { type: string, minLength: 1, maxLength: 32 } } ]
    get:
      operationId: getSKUPlatformContent
      responses:
        '200': { description: Current formal platform content and immutable history, content: { application/json: { schema: { $ref: '#/components/schemas/PlatformContentHistory' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    UserID:
      name: user_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ModelFamilyID: { in: path, name: family_id, required: true, schema: { type: string, format: uuid } }
    ModelFamilyMemberID: { in: path, name: member_id, required: true, schema: { type: string, format: uuid } }
    VariantIdentityVersionID: { in: path, name: version_id, required: true, schema: { type: string, format: uuid } }
    SOPID: { in: path, name: sop_id, required: true, schema: { type: string, format: uuid } }
    VersionID: { in: path, name: version_id, required: true, schema: { type: string, format: uuid } }
    ViewID: { in: path, name: view_id, required: true, schema: { type: string, format: uuid } }
    ImageID: { in: path, name: image_id, required: true, schema: { type: string, format: uuid } }
    AIContentTemplateID: { in: path, name: template_id, required: true, schema: { type: string, format: uuid } }
    AIContentTemplateVersionID: { in: path, name: version_id, required: true, schema: { type: string, format: uuid } }
    AIJobID: { in: path, name: job_id, required: true, schema: { type: string, format: uuid } }
    AIJobItemID: { in: path, name: item_id, required: true, schema: { type: string, format: uuid } }
    AITextResultID: { in: path, name: result_id, required: true, schema: { type: string, format: uuid } }
    AIImageResultID: { in: path, name: result_id, required: true, schema: { type: string, format: uuid } }
    SKUID: { in: path, name: sku_id, required: true, schema: { type: string, format: uuid } }
    AssetID: { in: path, name: asset_id, required: true, schema: { type: string, format: uuid } }
    IdempotencyKey: { in: header, name: Idempotency-Key, required: true, description: "Actor-scoped create key. Reusing it with the same normalized request returns the original job; different input returns 409.", schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$' } }
    SOPRevision:
      in: header
      name: X-SOP-Version-Updated-At
      required: true
      description: Exact updated_at value from the latest SOPVersion response; stale revisions return 409.
      schema: { type: string, format: date-time }
  requestBodies:
    UUIDOrder:
      required: true
      content: { application/json: { schema: { type: object, additionalProperties: false, required: [public_ids], properties: { public_ids: { type: array, items: { type: string, format: uuid }, uniqueItems: true } } } } }
  responses:
    BadRequest: { description: Invalid input, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Unauthorized: { description: Missing or invalid bearer token, content: { application/json: { schema: { $ref: '#/components/schemas/AuthErrorResponse' } } } }
    Forbidden: { description: Authenticated user lacks the required role, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    NotFound: { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Conflict: { description: Lifecycle conflict, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    PreconditionRequired: { description: X-SOP-Version-Updated-At is required for draft aggregate mutations, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    ValidationFailed: { description: SOP aggregate validation failed, content: { application/json: { schema: { $ref: '#/components/schemas/ValidationResponse' } } } }
    VariantIdentityValidationFailed: { description: Variant identity validation failed, content: { application/json: { schema: { $ref: '#/components/schemas/VariantIdentityValidationResponse' } } } }
    InternalServerError: { description: Unexpected database or server error, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    ServiceUnavailable: { description: Required service or server dependency unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  schemas:
    User:
      type: object
      additionalProperties: false
      required: [public_id, name, email, role, status, must_change_password, last_seen_at, created_at]
      properties:
        public_id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [super_admin, admin, operator] }
        status: { type: string, enum: [active, disabled] }
        must_change_password: { type: boolean }
        last_seen_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    AuthResponse:
      type: object
      additionalProperties: false
      required: [token, user]
      properties:
        token: { type: string, writeOnly: true }
        user: { $ref: '#/components/schemas/User' }
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password: { type: string, format: password, writeOnly: true }
        new_password: { type: string, format: password, minLength: 12, maxLength: 72, writeOnly: true }
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [name, email, role, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, maxLength: 180 }
        role: { type: string, enum: [admin, operator] }
        password: { type: string, format: password, minLength: 12, maxLength: 72, writeOnly: true }
    UpdateUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        role: { type: string, enum: [admin, operator] }
        status: { type: string, enum: [active, disabled] }
    ResetUserPasswordRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: { type: string, format: password, minLength: 12, maxLength: 72, writeOnly: true }
    OpenAISetting:
      type: object
      additionalProperties: false
      required: [provider, status, key_fingerprint, text_model, image_model, image_api_mode, image_responses_model, image_generation_model, verified_at, image_capability_verified_at, image_responses_verified_at, image_generation_verified_at, last_used_at]
      properties:
        provider: { type: string, enum: [openai] }
        status: { type: string, enum: [unconfigured, active, invalid, disabled] }
        key_fingerprint: { type: string, maxLength: 16, description: Non-secret display fingerprint; empty when unconfigured. }
        text_model: { type: string, maxLength: 200, description: Model used for new text generation tasks. }
        image_model: { type: string, maxLength: 200, description: Deprecated compatibility field containing the currently active image model. }
        image_api_mode: { type: string, enum: [responses, images] }
        image_responses_model: { type: string, maxLength: 200, description: Mainline Responses model that can call the image_generation tool. }
        image_generation_model: { type: string, maxLength: 200, description: GPT Image model used directly with the Images API. }
        verified_at: { type: string, format: date-time, nullable: true }
        image_capability_verified_at: { type: string, format: date-time, nullable: true }
        image_responses_verified_at: { type: string, format: date-time, nullable: true }
        image_generation_verified_at: { type: string, format: date-time, nullable: true }
        last_used_at: { type: string, format: date-time, nullable: true }
    OpenAISettingRequest:
      type: object
      additionalProperties: false
      required: [api_key]
      properties:
        api_key: { type: string, format: password, minLength: 20, writeOnly: true }
    OpenAIModel:
      type: object
      additionalProperties: false
      required: [id, owned_by, supports_text, supports_image_tool, supports_images_api]
      properties:
        id: { type: string, maxLength: 200 }
        owned_by: { type: string, maxLength: 200 }
        supports_text: { type: boolean }
        supports_image_tool: { type: boolean }
        supports_images_api: { type: boolean }
        compatibility_reason: { type: string }
    OpenAIModelSelectionRequest:
      type: object
      additionalProperties: false
      required: [text_model, image_api_mode, image_responses_model, image_generation_model]
      properties:
        text_model: { type: string, minLength: 1, maxLength: 200 }
        image_model: { type: string, minLength: 1, maxLength: 200, deprecated: true }
        image_api_mode: { type: string, enum: [responses, images] }
        image_responses_model: { type: string, minLength: 1, maxLength: 200 }
        image_generation_model: { type: string, minLength: 1, maxLength: 200 }
    AIContentSlotMutation:
      type: object
      additionalProperties: false
      properties:
        slot_key: { type: string, maxLength: 80 }
        kind: { type: string, enum: [image, title, seo_description] }
        name_zh: { type: string, maxLength: 180 }
        name_en: { type: string, maxLength: 180 }
        description_zh: { type: string }
        description_en: { type: string }
        sequence: { type: integer, minimum: 1 }
        optional: { type: boolean }
        default_selected: { type: boolean }
        prompt_fragment: { type: string }
        constraints: {}
        generation_config: {}
        layout_config: {}
    AIContentTemplateMutationRequest:
      type: object
      additionalProperties: false
      properties:
        name_zh: { type: string, maxLength: 180 }
        name_en: { type: string, maxLength: 180 }
        target_platform: { type: string, maxLength: 80 }
        default_locale: { type: string, maxLength: 32 }
        prompt_compiler_version: { type: string, maxLength: 64 }
        platform_prompt: { type: string }
        slots: { type: array, items: { $ref: '#/components/schemas/AIContentSlotMutation' } }
    CopyAIContentTemplateVersionRequest:
      type: object
      additionalProperties: false
      required: [source_version_id]
      properties:
        source_version_id: { type: string, format: uuid }
