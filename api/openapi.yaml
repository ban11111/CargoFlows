openapi: 3.0.3
info:
  title: CargoFlow API
  version: 1.0.0
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /capture-sops:
    post:
      operationId: createCaptureSOP
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateCaptureSOPRequest' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/SOPVersion' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    get:
      operationId: listCaptureSOPs
      parameters:
        - { in: query, name: category_id, schema: { type: integer, minimum: 1 } }
        - { in: query, name: include_all, description: "Manager-only lifecycle listing (admin/operator). When true, includes draft-only and archived-only SOPs and every ordered version. Defaults to published-only selection semantics.", schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Capture SOPs
          content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/CaptureSOPSummary' } } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /capture-sops/{sop_id}:
    parameters: [ { $ref: '#/components/parameters/SOPID' } ]
    get:
      operationId: getCaptureSOP
      responses:
        '200': { description: Capture SOP, content: { application/json: { schema: { $ref: '#/components/schemas/CaptureSOPSummary' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /capture-sops/{sop_id}/versions:
    parameters: [ { $ref: '#/components/parameters/SOPID' } ]
    post:
      operationId: copySOPVersion
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [source_version_id], properties: { source_version_id: { type: string, format: uuid } } } } }
      responses:
        '201': { description: Copied draft, content: { application/json: { schema: { $ref: '#/components/schemas/SOPVersion' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /sop-versions/{version_id}:
    parameters: [ { $ref: '#/components/parameters/VersionID' } ]
    get:
      operationId: getSOPVersion
      responses:
        '200': { description: SOP version, content: { application/json: { schema: { $ref: '#/components/schemas/SOPVersion' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    patch:
      operationId: updateSOPVersion
      parameters: [ { $ref: '#/components/parameters/SOPRevision' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/VersionMetadataRequest' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/SOPVersion' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /sop-versions/{version_id}/views:
    parameters: [ { $ref: '#/components/parameters/VersionID' } ]
    post:
      operationId: addSOPView
      parameters: [ { $ref: '#/components/parameters/SOPRevision' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AddViewRequest' } } }
      responses:
        '201': { description: View added, content: { application/json: { schema: { $ref: '#/components/schemas/SOPVersion' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /sop-versions/{version_id}/views/{view_id}:
    parameters: [ { $ref: '#/components/parameters/VersionID' }, { $ref: '#/components/parameters/ViewID' } ]
    patch:
      operationId: updateSOPView
      parameters: [ { $ref: '#/components/parameters/SOPRevision' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ViewMutation' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/SOPVersion' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      operationId: deleteSOPView
      parameters: [ { $ref: '#/components/parameters/SOPRevision' } ]
      responses:
        '200': { description: Deleted, content: { application/json: { schema: { $ref: '#/components/schemas/SOPVersion' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /sop-versions/{version_id}/view-order:
    parameters: [ { $ref: '#/components/parameters/VersionID' } ]
    put:
      operationId: reorderSOPViews
      parameters: [ { $ref: '#/components/parameters/SOPRevision' } ]
      requestBody: { $ref: '#/components/requestBodies/UUIDOrder' }
      responses:
        '200': { description: Reordered, content: { application/json: { schema: { $ref: '#/components/schemas/SOPVersion' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /sop-versions/{version_id}/validate:
    parameters: [ { $ref: '#/components/parameters/VersionID' } ]
    post:
      operationId: validateSOPVersion
      responses:
        '200': { description: Validation result, content: { application/json: { schema: { $ref: '#/components/schemas/ValidationResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /sop-versions/{version_id}/publish:
    parameters: [ { $ref: '#/components/parameters/VersionID' } ]
    post:
      operationId: publishSOPVersion
      parameters: [ { $ref: '#/components/parameters/SOPRevision' } ]
      responses:
        '200': { description: Published, content: { application/json: { schema: { $ref: '#/components/schemas/SOPVersion' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /sop-versions/{version_id}/archive:
    parameters: [ { $ref: '#/components/parameters/VersionID' } ]
    post:
      operationId: archiveSOPVersion
      responses:
        '200': { description: Archived, content: { application/json: { schema: { $ref: '#/components/schemas/SOPVersion' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /sop-versions/{version_id}/views/{view_id}/reference-images/upload-url:
    parameters: [ { $ref: '#/components/parameters/VersionID' }, { $ref: '#/components/parameters/ViewID' } ]
    post:
      operationId: createSOPReferenceUploadURL
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [file_name, content_type], properties: { file_name: { type: string, minLength: 1 }, content_type: { type: string, pattern: '^image/' } } } } }
      responses:
        '200': { description: SOP reference upload details, content: { application/json: { schema: { $ref: '#/components/schemas/SOPReferenceUploadEnvelope' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /sop-versions/{version_id}/views/{view_id}/reference-images:
    parameters: [ { $ref: '#/components/parameters/VersionID' }, { $ref: '#/components/parameters/ViewID' } ]
    post:
      operationId: addSOPReferenceImage
      parameters: [ { $ref: '#/components/parameters/SOPRevision' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AddReferenceImageRequest' } } }
      responses:
        '201': { description: Reference image added, content: { application/json: { schema: { $ref: '#/components/schemas/SOPVersion' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /sop-versions/{version_id}/views/{view_id}/reference-images/{image_id}:
    parameters: [ { $ref: '#/components/parameters/VersionID' }, { $ref: '#/components/parameters/ViewID' }, { $ref: '#/components/parameters/ImageID' } ]
    delete:
      operationId: deleteSOPReferenceImage
      parameters: [ { $ref: '#/components/parameters/SOPRevision' } ]
      responses:
        '200': { description: Deleted, content: { application/json: { schema: { $ref: '#/components/schemas/SOPVersion' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /sop-versions/{version_id}/views/{view_id}/reference-image-order:
    parameters: [ { $ref: '#/components/parameters/VersionID' }, { $ref: '#/components/parameters/ViewID' } ]
    put:
      operationId: reorderSOPReferenceImages
      parameters: [ { $ref: '#/components/parameters/SOPRevision' } ]
      requestBody: { $ref: '#/components/requestBodies/UUIDOrder' }
      responses:
        '200': { description: Reordered, content: { application/json: { schema: { $ref: '#/components/schemas/SOPVersion' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /photo-sessions:
    post:
      operationId: createPhotoSession
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreatePhotoSessionRequest' } } }
      responses:
        '201': { description: Photo session created, content: { application/json: { schema: { $ref: '#/components/schemas/PhotoSession' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /assets/upload-url:
    post:
      operationId: createAssetUploadURL
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateAssetUploadRequest' } } }
      responses:
        '200': { description: Capture asset upload details with a signed completion ticket, content: { application/json: { schema: { $ref: '#/components/schemas/AssetUploadEnvelope' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /assets/complete:
    post:
      operationId: completeAssetUpload
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CompleteAssetRequest' } } }
      responses:
        '200': { description: Idempotent replay; returns the asset previously created by this completion ticket, content: { application/json: { schema: { $ref: '#/components/schemas/CompletedAsset' } } } }
        '201': { description: Asset completed, content: { application/json: { schema: { $ref: '#/components/schemas/CompletedAsset' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /assets/review:
    get:
      operationId: listAssetsForReview
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [pending, approved, rejected] } }
      responses:
        '200': { description: Review assets, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/AssetReviewItem' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /assets/review/hierarchy:
    get:
      operationId: listAssetReviewHierarchy
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [pending, approved, rejected] } }
      responses:
        '200': { description: Review assets grouped by category and SKU, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/AssetReviewCategory' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /settings/openai:
    get:
      operationId: getOpenAISetting
      responses:
        '200': { description: Masked OpenAI provider setting, content: { application/json: { schema: { $ref: '#/components/schemas/OpenAISetting' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    put:
      operationId: putOpenAISetting
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OpenAISettingRequest' } } }
      responses:
        '200': { description: Verified and activated OpenAI provider setting, content: { application/json: { schema: { $ref: '#/components/schemas/OpenAISetting' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: OpenAI rejected the supplied credential, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      operationId: disableOpenAISetting
      responses:
        '200': { description: Disabled OpenAI provider setting, content: { application/json: { schema: { $ref: '#/components/schemas/OpenAISetting' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /ai-content-templates:
    get:
      operationId: listAIContentTemplates
      parameters:
        - { in: query, name: include_all, description: When true includes draft and archived versions; otherwise returns templates with published versions only., schema: { type: boolean, default: false } }
      responses:
        '200': { description: AI content templates, content: { application/json: { schema: { type: object, additionalProperties: false, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/AIContentTemplate' } } } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      operationId: createAIContentTemplate
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AIContentTemplateMutationRequest' } } }
      responses:
        '201': { description: Created template with its initial draft, content: { application/json: { schema: { $ref: '#/components/schemas/AIContentTemplate' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /ai-content-templates/{template_id}:
    parameters: [ { $ref: '#/components/parameters/AIContentTemplateID' } ]
    get:
      operationId: getAIContentTemplate
      responses:
        '200': { description: AI content template with ordered versions and slots, content: { application/json: { schema: { $ref: '#/components/schemas/AIContentTemplate' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /ai-content-templates/{template_id}/versions:
    parameters: [ { $ref: '#/components/parameters/AIContentTemplateID' } ]
    post:
      operationId: copyAIContentTemplateVersion
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CopyAIContentTemplateVersionRequest' } } }
      responses:
        '201': { description: Copied draft version, content: { application/json: { schema: { $ref: '#/components/schemas/AIContentTemplateVersion' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /ai-content-template-versions/{version_id}:
    parameters: [ { $ref: '#/components/parameters/AIContentTemplateVersionID' } ]
    patch:
      operationId: updateAIContentTemplateVersion
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AIContentTemplateMutationRequest' } } }
      responses:
        '200': { description: Updated draft version, content: { application/json: { schema: { $ref: '#/components/schemas/AIContentTemplateVersion' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /ai-content-template-versions/{version_id}/validate:
    parameters: [ { $ref: '#/components/parameters/AIContentTemplateVersionID' } ]
    post:
      operationId: validateAIContentTemplateVersion
      responses:
        '200': { description: Template validation result, content: { application/json: { schema: { $ref: '#/components/schemas/AITemplateValidationResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /ai-content-template-versions/{version_id}/publish:
    parameters: [ { $ref: '#/components/parameters/AIContentTemplateVersionID' } ]
    post:
      operationId: publishAIContentTemplateVersion
      responses:
        '200': { description: Published immutable template version, content: { application/json: { schema: { $ref: '#/components/schemas/AIContentTemplateVersion' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { description: Template validation failed, content: { application/json: { schema: { $ref: '#/components/schemas/AITemplateValidationResponse' } } } }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /ai-content-template-versions/{version_id}/archive:
    parameters: [ { $ref: '#/components/parameters/AIContentTemplateVersionID' } ]
    post:
      operationId: archiveAIContentTemplateVersion
      responses:
        '200': { description: Archived template version, content: { application/json: { schema: { $ref: '#/components/schemas/AIContentTemplateVersion' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /ai-jobs:
    get:
      operationId: listAIJobs
      responses:
        '200': { description: AI jobs in newest-first order, content: { application/json: { schema: { type: object, additionalProperties: false, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/AIJob' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      operationId: createAIJob
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateAIJobRequest' } } }
      responses:
        '200': { description: Idempotent replay of the existing AI job, content: { application/json: { schema: { $ref: '#/components/schemas/AIJob' } } } }
        '201': { description: Reproducible dry-run AI job, content: { application/json: { schema: { $ref: '#/components/schemas/AIJob' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { description: Selected SKU, SOP, slots, or assets are not eligible, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /ai-jobs/{job_id}:
    parameters: [ { $ref: '#/components/parameters/AIJobID' } ]
    get:
      operationId: getAIJob
      responses:
        '200': { description: AI job, content: { application/json: { schema: { $ref: '#/components/schemas/AIJob' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    SOPID: { in: path, name: sop_id, required: true, schema: { type: string, format: uuid } }
    VersionID: { in: path, name: version_id, required: true, schema: { type: string, format: uuid } }
    ViewID: { in: path, name: view_id, required: true, schema: { type: string, format: uuid } }
    ImageID: { in: path, name: image_id, required: true, schema: { type: string, format: uuid } }
    AIContentTemplateID: { in: path, name: template_id, required: true, schema: { type: string, format: uuid } }
    AIContentTemplateVersionID: { in: path, name: version_id, required: true, schema: { type: string, format: uuid } }
    AIJobID: { in: path, name: job_id, required: true, schema: { type: string, format: uuid } }
    IdempotencyKey: { in: header, name: Idempotency-Key, required: true, description: "Actor-scoped create key. Reusing it with the same normalized request returns the original job; different input returns 409.", schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$' } }
    SOPRevision:
      in: header
      name: X-SOP-Version-Updated-At
      required: true
      description: Exact updated_at value from the latest SOPVersion response; stale revisions return 409.
      schema: { type: string, format: date-time }
  requestBodies:
    UUIDOrder:
      required: true
      content: { application/json: { schema: { type: object, additionalProperties: false, required: [public_ids], properties: { public_ids: { type: array, items: { type: string, format: uuid }, uniqueItems: true } } } } }
  responses:
    BadRequest: { description: Invalid input, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Unauthorized: { description: Missing or invalid bearer token, content: { application/json: { schema: { $ref: '#/components/schemas/AuthErrorResponse' } } } }
    Forbidden: { description: Authenticated user lacks the required role, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    NotFound: { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Conflict: { description: Lifecycle conflict, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    PreconditionRequired: { description: X-SOP-Version-Updated-At is required for draft aggregate mutations, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    ValidationFailed: { description: SOP aggregate validation failed, content: { application/json: { schema: { $ref: '#/components/schemas/ValidationResponse' } } } }
    InternalServerError: { description: Unexpected database or server error, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    ServiceUnavailable: { description: Required service or server dependency unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  schemas:
    OpenAISetting:
      type: object
      additionalProperties: false
      required: [provider, status, key_fingerprint, verified_at, image_capability_verified_at, last_used_at]
      properties:
        provider: { type: string, enum: [openai] }
        status: { type: string, enum: [unconfigured, active, invalid, disabled] }
        key_fingerprint: { type: string, maxLength: 16, description: Non-secret display fingerprint; empty when unconfigured. }
        verified_at: { type: string, format: date-time, nullable: true }
        image_capability_verified_at: { type: string, format: date-time, nullable: true }
        last_used_at: { type: string, format: date-time, nullable: true }
    OpenAISettingRequest:
      type: object
      additionalProperties: false
      required: [api_key]
      properties:
        api_key: { type: string, format: password, minLength: 20, writeOnly: true }
    AIContentSlotMutation:
      type: object
      additionalProperties: false
      properties:
        slot_key: { type: string, maxLength: 80 }
        kind: { type: string, enum: [image, title, seo_description] }
        name_zh: { type: string, maxLength: 180 }
        name_en: { type: string, maxLength: 180 }
        description_zh: { type: string }
        description_en: { type: string }
        sequence: { type: integer, minimum: 1 }
        optional: { type: boolean }
        default_selected: { type: boolean }
        prompt_fragment: { type: string }
        constraints: {}
        generation_config: {}
        layout_config: {}
    AIContentTemplateMutationRequest:
      type: object
      additionalProperties: false
      properties:
        name_zh: { type: string, maxLength: 180 }
        name_en: { type: string, maxLength: 180 }
        target_platform: { type: string, maxLength: 80 }
        default_locale: { type: string, maxLength: 32 }
        prompt_compiler_version: { type: string, maxLength: 64 }
        platform_prompt: { type: string }
        slots: { type: array, items: { $ref: '#/components/schemas/AIContentSlotMutation' } }
    CopyAIContentTemplateVersionRequest:
      type: object
      additionalProperties: false
      required: [source_version_id]
      properties:
        source_version_id: { type: string, format: uuid }
    AIContentSlot:
      type: object
      additionalProperties: false
      required: [public_id, slot_key, kind, name_zh, name_en, description_zh, description_en, sequence, optional, default_selected, prompt_fragment, constraints, generation_config, layout_config]
      properties:
        public_id: { type: string, format: uuid }
        slot_key: { type: string }
        kind: { type: string, enum: [image, title, seo_description] }
        name_zh: { type: string }
        name_en: { type: string }
        description_zh: { type: string }
        description_en: { type: string }
        sequence: { type: integer, minimum: 1 }
        optional: { type: boolean }
        default_selected: { type: boolean }
        prompt_fragment: { type: string }
        constraints: {}
        generation_config: {}
        layout_config: {}
    AIContentTemplateVersion:
      type: object
      additionalProperties: false
      required: [public_id, version_number, status, default_locale, prompt_compiler_version, platform_prompt, published_at, archived_at, created_at, updated_at, slots]
      properties:
        public_id: { type: string, format: uuid }
        version_number: { type: integer, minimum: 1 }
        status: { type: string, enum: [draft, published, archived] }
        default_locale: { type: string }
        prompt_compiler_version: { type: string }
        platform_prompt: { type: string }
        published_at: { type: string, format: date-time, nullable: true }
        archived_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        slots: { type: array, items: { $ref: '#/components/schemas/AIContentSlot' } }
    AIContentTemplate:
      type: object
      additionalProperties: false
      required: [public_id, name_zh, name_en, target_platform, status, created_at, updated_at, versions]
      properties:
        public_id: { type: string, format: uuid }
        name_zh: { type: string }
        name_en: { type: string }
        target_platform: { type: string }
        status: { type: string, enum: [active, archived] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        versions: { type: array, items: { $ref: '#/components/schemas/AIContentTemplateVersion' } }
    CreateAIJobRequest:
      type: object
      additionalProperties: false
      required: [sku_id, template_version_id, selected_slot_keys, selected_asset_ids, locale]
      properties:
        sku_id: { type: integer, minimum: 1 }
        template_version_id: { type: string, format: uuid }
        selected_slot_keys: { type: array, minItems: 1, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 80 } }
        selected_asset_ids: { type: array, items: { type: integer, minimum: 1 }, description: Duplicate IDs are accepted and normalized to one ordered reference. }
        locale: { type: string, minLength: 2, maxLength: 32, pattern: '^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*$' }
        user_preference: { type: string, maxLength: 1000, description: Optional L4 user instruction stored immutably in the job snapshot. }
        generation_overrides:
          type: object
          additionalProperties: { $ref: '#/components/schemas/AIJobGenerationOverride' }
          description: Per-selected-slot overrides; each supplied value must appear in the published slot's matching allowed_* array.
    AIJobGenerationOverride:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        candidate_count: { type: integer, minimum: 1, maximum: 4 }
        size: { type: string, enum: [1024x1024, 1536x1024, 1024x1536], description: Image slots only. }
        quality: { type: string, enum: [low, medium, high, auto], description: Image slots only. }
        style: { type: string, minLength: 1, maxLength: 80, description: Image slots only; must exactly match a trimmed published allowed style. }
    AIJob:
      type: object
      additionalProperties: false
      required: [public_id, sku_id, template_version_id, target_platform, locale, status, snapshot_schema, input_snapshot, started_at, completed_at, cancelled_at, created_at, updated_at, items]
      properties:
        public_id: { type: string, format: uuid }
        sku_id: { type: integer, minimum: 1 }
        template_version_id: { type: string, format: uuid }
        target_platform: { type: string }
        locale: { type: string }
        status: { type: string, enum: [queued, running, partial, completed, failed, cancelled] }
        snapshot_schema: { type: string, enum: [cargoflow_product_generation_v1] }
        input_snapshot: { $ref: '#/components/schemas/ProductSnapshotV1' }
        started_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
        cancelled_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        items: { type: array, items: { $ref: '#/components/schemas/AIJobItem' } }
    AIJobItem:
      type: object
      additionalProperties: false
      required: [public_id, slot_key, kind, status, slot_snapshot, selected_input_asset_ids, attempt_count, safe_error, started_at, completed_at, created_at, updated_at]
      properties:
        public_id: { type: string, format: uuid }
        slot_key: { type: string }
        kind: { type: string, enum: [image, title, seo_description] }
        status: { type: string, enum: [queued, running, completed, failed, cancelled] }
        slot_snapshot: { $ref: '#/components/schemas/AIJobSlotSnapshot' }
        selected_input_asset_ids: { type: array, items: { type: integer, minimum: 1 } }
        attempt_count: { type: integer, minimum: 0 }
        safe_error: { type: string }
        started_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AIJobSlotSnapshot:
      type: object
      additionalProperties: false
      required: [public_id, slot_key, kind, name, description, sequence, optional, default_selected, prompt_fragment, constraints, generation_config, layout_config]
      properties:
        public_id: { type: string, format: uuid }
        slot_key: { type: string }
        kind: { type: string, enum: [image, title, seo_description] }
        name: { $ref: '#/components/schemas/AISnapshotLocalizedText' }
        description: { $ref: '#/components/schemas/AISnapshotLocalizedText' }
        sequence: { type: integer, minimum: 1 }
        optional: { type: boolean }
        default_selected: { type: boolean }
        prompt_fragment: { type: string }
        constraints: { type: object, additionalProperties: true }
        generation_config: { type: object, additionalProperties: true }
        layout_config: { type: object, additionalProperties: true }
    AISnapshotLocalizedText:
      type: object
      additionalProperties: false
      required: [zh, en]
      properties: { zh: { type: string }, en: { type: string } }
    AISnapshotVector:
      type: object
      additionalProperties: false
      required: [x, y, z]
      properties: { x: { type: number }, y: { type: number }, z: { type: number } }
    AISnapshotCategory:
      type: object
      additionalProperties: false
      required: [name_zh, name_en]
      properties: { name_zh: { type: string }, name_en: { type: string } }
    AISnapshotProduct:
      type: object
      additionalProperties: false
      required: [name, brand, description, category]
      properties:
        name: { type: string }
        brand: { type: string }
        description: { type: string }
        category: { $ref: '#/components/schemas/AISnapshotCategory' }
    AISnapshotSKU:
      type: object
      additionalProperties: false
      required: [code, color, size, platform_title, selling_points, tags]
      properties:
        code: { type: string }
        color: { type: string }
        size: { type: string }
        platform_title: { type: string }
        selling_points: { type: string }
        tags: { type: array, items: { type: string } }
    AISnapshotSOPView:
      type: object
      additionalProperties: false
      required: [public_id, sequence, role, view_kind, preset_key, name, instruction, required, camera_position_direction, image_up_direction, target, composition]
      properties:
        public_id: { type: string, format: uuid }
        sequence: { type: integer, minimum: 1 }
        role: { type: string, enum: [reference_front, capture] }
        view_kind: { type: string, enum: [standard, detail] }
        preset_key: { type: string }
        name: { $ref: '#/components/schemas/AISnapshotLocalizedText' }
        instruction: { $ref: '#/components/schemas/AISnapshotLocalizedText' }
        required: { type: boolean }
        camera_position_direction: { $ref: '#/components/schemas/AISnapshotVector' }
        image_up_direction: { $ref: '#/components/schemas/AISnapshotVector' }
        target: { $ref: '#/components/schemas/AISnapshotVector' }
        composition: { $ref: '#/components/schemas/Composition' }
    AISnapshotSOP:
      type: object
      additionalProperties: false
      required: [public_id, version_public_id, version_number, schema_version, name, description, coordinate_system, views]
      properties:
        public_id: { type: string, format: uuid }
        version_public_id: { type: string, format: uuid }
        version_number: { type: integer, minimum: 1 }
        schema_version: { type: string }
        name: { $ref: '#/components/schemas/AISnapshotLocalizedText' }
        description: { $ref: '#/components/schemas/AISnapshotLocalizedText' }
        coordinate_system: { type: string, enum: [pcs_object_v1] }
        views: { type: array, items: { $ref: '#/components/schemas/AISnapshotSOPView' } }
    AISnapshotAssetView:
      type: object
      additionalProperties: false
      required: [public_id, preset_key, name, role, view_kind, instruction, camera_position_direction, image_up_direction, target, composition]
      properties:
        public_id: { type: string, format: uuid }
        preset_key: { type: string }
        name: { $ref: '#/components/schemas/AISnapshotLocalizedText' }
        role: { type: string, enum: [reference_front, capture] }
        view_kind: { type: string, enum: [standard, detail] }
        instruction: { $ref: '#/components/schemas/AISnapshotLocalizedText' }
        camera_position_direction: { $ref: '#/components/schemas/AISnapshotVector' }
        image_up_direction: { $ref: '#/components/schemas/AISnapshotVector' }
        target: { $ref: '#/components/schemas/AISnapshotVector' }
        composition: { $ref: '#/components/schemas/Composition' }
    AISnapshotAsset:
      type: object
      additionalProperties: false
      required: [id, object_key, original_url, thumbnail_url, captured_at, view]
      properties:
        id: { type: integer, minimum: 1 }
        object_key: { type: string }
        original_url: { type: string, format: uri }
        thumbnail_url: { type: string }
        captured_at: { type: string, format: date-time }
        view: { $ref: '#/components/schemas/AISnapshotAssetView' }
    AISnapshotTemplate:
      type: object
      additionalProperties: false
      required: [template_public_id, version_public_id, version_number, prompt_compiler_version, platform_prompt, selected_slots]
      properties:
        template_public_id: { type: string, format: uuid }
        version_public_id: { type: string, format: uuid }
        version_number: { type: integer, minimum: 1 }
        prompt_compiler_version: { type: string }
        platform_prompt: { type: string }
        selected_slots: { type: array, items: { $ref: '#/components/schemas/AIJobSlotSnapshot' } }
    ProductSnapshotV1:
      type: object
      additionalProperties: false
      required: [schema, locale, target_platform, product, sku, sop, template, selected_assets, user_preference, generation_overrides]
      properties:
        schema: { type: string, enum: [cargoflow_product_generation_v1] }
        locale: { type: string }
        target_platform: { type: string }
        product: { $ref: '#/components/schemas/AISnapshotProduct' }
        sku: { $ref: '#/components/schemas/AISnapshotSKU' }
        sop: { $ref: '#/components/schemas/AISnapshotSOP' }
        template: { $ref: '#/components/schemas/AISnapshotTemplate' }
        selected_assets: { type: array, items: { $ref: '#/components/schemas/AISnapshotAsset' } }
        user_preference: { type: string, maxLength: 1000 }
        generation_overrides: { type: object, additionalProperties: { $ref: '#/components/schemas/AIJobGenerationOverride' } }
    AITemplateValidationIssue:
      type: object
      additionalProperties: false
      required: [code, path, message]
      properties:
        code: { type: string }
        path: { type: string }
        message: { type: string }
    AITemplateValidationResponse:
      type: object
      additionalProperties: false
      required: [code, issues]
      properties:
        code: { type: string, enum: [template_valid, template_validation_failed] }
        issues: { type: array, items: { $ref: '#/components/schemas/AITemplateValidationIssue' } }
    LocalizedText:
      type: object
      additionalProperties: false
      required: [zh-CN, en]
      properties: { zh-CN: { type: string }, en: { type: string } }
    Vector3:
      type: array
      minItems: 3
      maxItems: 3
      items: { type: number, format: double }
    Composition:
      type: object
      additionalProperties: false
      required: [frame_occupancy, aspect_ratio, allow_rotation_correction, allow_mirror]
      properties:
        frame_occupancy: { type: number, exclusiveMinimum: 0, maximum: 1 }
        aspect_ratio: { type: string, pattern: '^[1-9][0-9]*:[1-9][0-9]*$' }
        allow_rotation_correction: { type: boolean }
        allow_mirror: { type: boolean, enum: [false] }
    Pose:
      type: object
      additionalProperties: false
      required: [space, camera_position_direction, image_up_direction, target]
      properties:
        space: { type: string, enum: [object] }
        camera_position_direction: { $ref: '#/components/schemas/Vector3' }
        image_up_direction: { $ref: '#/components/schemas/Vector3' }
        target: { $ref: '#/components/schemas/Vector3' }
    ReferenceImage:
      type: object
      required: [public_id, object_key, thumbnail_url, sort_order, caption]
      properties:
        public_id: { type: string, format: uuid }
        object_key: { type: string }
        thumbnail_url: { type: string }
        sort_order: { type: integer, minimum: 1 }
        caption: { $ref: '#/components/schemas/LocalizedText' }
        created_at: { type: string, format: date-time }
    SOPView:
      type: object
      required: [public_id, sequence, role, view_kind, name, instruction, required, pose, composition, reference_images]
      properties:
        public_id: { type: string, format: uuid }
        sequence: { type: integer, minimum: 1 }
        role: { type: string, enum: [reference_front, capture] }
        view_kind: { type: string, enum: [standard, detail] }
        preset_key: { type: string }
        name: { $ref: '#/components/schemas/LocalizedText' }
        instruction: { $ref: '#/components/schemas/LocalizedText' }
        required: { type: boolean }
        pose: { $ref: '#/components/schemas/Pose' }
        composition: { $ref: '#/components/schemas/Composition' }
        reference_images: { type: array, items: { $ref: '#/components/schemas/ReferenceImage' } }
    CoordinateSystem:
      type: object
      additionalProperties: false
      required: [id, handedness, origin, unit, axes]
      properties:
        id: { type: string, enum: [pcs_object_v1] }
        handedness: { type: string, enum: [right_handed] }
        origin: { type: string, enum: [bounding_box_center] }
        unit: { type: string, enum: [normalized] }
        axes:
          type: object
          additionalProperties: false
          required: [x_positive, y_positive, z_positive]
          properties:
            x_positive: { type: string, enum: [object_top] }
            y_positive: { type: string, enum: [object_left] }
            z_positive: { type: string, enum: [object_front] }
    SOPVersion:
      type: object
      required: [schema_version, public_id, sop_public_id, version_number, status, name, description, coordinate_system, updated_at, views]
      properties:
        schema_version: { type: string, enum: ['1.0'] }
        public_id: { type: string, format: uuid }
        sop_public_id: { type: string, format: uuid }
        version_number: { type: integer, minimum: 1 }
        status: { type: string, enum: [draft, published, archived] }
        name: { $ref: '#/components/schemas/LocalizedText' }
        description: { $ref: '#/components/schemas/LocalizedText' }
        coordinate_system: { $ref: '#/components/schemas/CoordinateSystem' }
        published_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        views: { type: array, items: { $ref: '#/components/schemas/SOPView' } }
    CaptureSOPSummary:
      type: object
      required: [public_id, category_id, versions]
      properties:
        public_id: { type: string, format: uuid }
        category_id: { type: integer, minimum: 1 }
        versions: { type: array, items: { $ref: '#/components/schemas/SOPVersion' } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ViewMutation:
      type: object
      additionalProperties: false
      required: [role, view_kind, name, instruction, required, pose, composition]
      properties:
        role: { type: string, enum: [reference_front, capture] }
        view_kind: { type: string, enum: [standard, detail] }
        name: { $ref: '#/components/schemas/LocalizedText' }
        instruction: { $ref: '#/components/schemas/LocalizedText' }
        required: { type: boolean }
        pose: { $ref: '#/components/schemas/Pose' }
        composition: { $ref: '#/components/schemas/Composition' }
    AddViewRequest:
      type: object
      additionalProperties: false
      oneOf:
        - required: [preset_key]
        - required: [custom]
      properties:
        preset_key: { type: string, enum: [back, left, bottom, right, top, detail_label, packaging_front] }
        custom: { $ref: '#/components/schemas/ViewMutation' }
    CreateCaptureSOPRequest:
      type: object
      additionalProperties: false
      required: [category_id, name]
      properties:
        category_id: { type: integer, minimum: 1 }
        name: { $ref: '#/components/schemas/LocalizedText' }
        description: { $ref: '#/components/schemas/LocalizedText' }
    VersionMetadataRequest:
      type: object
      additionalProperties: false
      required: [name, description]
      properties:
        name: { $ref: '#/components/schemas/LocalizedText' }
        description: { $ref: '#/components/schemas/LocalizedText' }
    AddReferenceImageRequest:
      type: object
      additionalProperties: false
      required: [object_key, thumbnail_url, caption]
      properties:
        object_key: { type: string, minLength: 1 }
        thumbnail_url: { type: string, minLength: 1 }
        caption: { $ref: '#/components/schemas/LocalizedText' }
        sort_order: { type: integer, minimum: 1 }
    ValidationError:
      type: object
      required: [code, path, message]
      properties: { code: { type: string }, path: { type: string }, message: { $ref: '#/components/schemas/LocalizedText' } }
    ValidationResponse:
      type: object
      required: [code, errors]
      properties:
        code: { type: string, enum: [sop_valid, sop_validation_failed] }
        errors: { type: array, items: { $ref: '#/components/schemas/ValidationError' } }
    ErrorResponse:
      type: object
      required: [code, message]
      properties: { code: { type: string }, message: { type: string } }
    AuthErrorResponse:
      type: object
      required: [message]
      properties: { message: { type: string } }
    SOPReferenceUploadEnvelope:
      type: object
      required: [method, upload_url, asset_url, object_key, expires_in, headers]
      properties:
        method: { type: string, enum: [PUT] }
        upload_url: { type: string, format: uri }
        asset_url: { type: string, format: uri }
        object_key: { type: string }
        expires_in: { type: integer }
        headers: { type: object, additionalProperties: { type: string } }
    AssetUploadEnvelope:
      type: object
      required: [method, upload_url, asset_url, object_key, completion_token, expires_in, headers]
      properties:
        method: { type: string, enum: [PUT] }
        upload_url: { type: string, format: uri }
        asset_url: { type: string, format: uri }
        object_key: { type: string }
        completion_token: { type: string, minLength: 1, description: "Short-lived signed ticket required to complete this exact upload." }
        expires_in: { type: integer }
        headers: { type: object, additionalProperties: { type: string } }
    CreatePhotoSessionRequest:
      type: object
      additionalProperties: false
      required: [sku_id, sop_version_id]
      properties:
        sku_id: { type: integer, minimum: 1 }
        sop_version_id: { type: string, format: uuid }
    PhotoSession:
      type: object
      required: [public_id, code, sku_id, sop_version_id, status, created_at]
      properties:
        public_id: { type: string, format: uuid }
        code: { type: string }
        sku_id: { type: integer, minimum: 1 }
        sop_version_id: { type: string, format: uuid }
        status: { type: string, enum: [in_progress, completed] }
        created_at: { type: string, format: date-time }
    CreateAssetUploadRequest:
      type: object
      additionalProperties: false
      required: [file_name, content_type, photo_session_id, sop_view_id]
      properties:
        file_name: { type: string, minLength: 1 }
        content_type: { type: string, pattern: '^image/' }
        photo_session_id: { type: string, format: uuid }
        sop_view_id: { type: string, format: uuid }
    CompleteAssetRequest:
      type: object
      additionalProperties: false
      required: [photo_session_id, sop_view_id, completion_token]
      properties:
        photo_session_id: { type: string, format: uuid }
        sop_view_id: { type: string, format: uuid }
        completion_token: { type: string, minLength: 1, description: "Signed ticket returned by createAssetUploadURL; binds user, session, view, object key, and expiry." }
        captured_at: { type: string, format: date-time }
    CompletedAsset:
      type: object
      required: [id, sku_id, photo_session_id, sop_view_id, object_key, original_url, thumbnail_url, review_status, captured_at]
      properties:
        id: { type: integer, minimum: 1 }
        sku_id: { type: integer, minimum: 1 }
        photo_session_id: { type: string, format: uuid }
        sop_view_id: { type: string, format: uuid }
        object_key: { type: string }
        original_url: { type: string }
        thumbnail_url: { type: string }
        review_status: { type: string, enum: [pending, approved, rejected] }
        captured_at: { type: string, format: date-time }
    AssetReviewItem:
      type: object
      required: [id, sku_id, original_url, thumbnail_url, review_status, captured_at, sop_view_name, photo_session_code]
      properties:
        id: { type: integer, minimum: 1 }
        sku_id: { type: integer, minimum: 1 }
        original_url: { type: string }
        thumbnail_url: { type: string }
        review_status: { type: string, enum: [pending, approved, rejected] }
        captured_at: { type: string, format: date-time }
        sop_view_name: { $ref: '#/components/schemas/LocalizedText' }
        photo_session_code: { type: string }
    Tag:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, minimum: 1 }
        name: { type: string }
    AssetReviewSKU:
      type: object
      required: [id, code, product_name, tags, assets]
      properties:
        id: { type: integer, minimum: 1 }
        code: { type: string }
        product_name: { type: string }
        tags: { type: array, items: { $ref: '#/components/schemas/Tag' } }
        assets: { type: array, items: { $ref: '#/components/schemas/AssetReviewHierarchyAsset' } }
    AssetReviewHierarchyAsset:
      type: object
      required: [id, original_url, thumbnail_url, review_status, captured_at, sop_view_name, photo_session_code]
      properties:
        id: { type: integer, minimum: 1 }
        original_url: { type: string }
        thumbnail_url: { type: string }
        review_status: { type: string, enum: [pending, approved, rejected] }
        captured_at: { type: string, format: date-time }
        sop_view_name: { $ref: '#/components/schemas/LocalizedText' }
        photo_session_code: { type: string }
    AssetReviewCategory:
      type: object
      required: [id, name, name_en, is_system, skus]
      properties:
        id: { type: integer }
        name: { type: string }
        name_en: { type: string }
        is_system: { type: boolean }
        skus: { type: array, items: { $ref: '#/components/schemas/AssetReviewSKU' } }
