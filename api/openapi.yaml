openapi: 3.0.3
info:
  title: CargoFlows API
  version: 1.0.0
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /auth/me:
    get:
      operationId: getCurrentUser
      responses:
        '200': { description: Current authenticated user, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/change-password:
    post:
      operationId: changePassword
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ChangePasswordRequest' } } }
      responses:
        '200': { description: Password changed and replacement bearer token issued, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /users:
    get:
      operationId: listUsers
      responses:
        '200': { description: Users, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/User' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createUser
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateUserRequest' } } }
      responses:
        '201': { description: User created, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /users/{user_id}:
    parameters: [ { $ref: '#/components/parameters/UserID' } ]
    patch:
      operationId: updateUser
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateUserRequest' } } }
      responses:
        '200': { description: User updated, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      operationId: deleteUser
      description: Soft-delete a disabled admin or operator account while preserving historical attribution.
      responses:
        '204': { description: User deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /users/{user_id}/password:
    parameters: [ { $ref: '#/components/parameters/UserID' } ]
    put:
      operationId: resetUserPassword
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ResetUserPasswordRequest' } } }
      responses:
        '200': { description: Temporary password set, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /skus:
    get:
      operationId: listSKUs
      parameters:
        - { in: query, name: category_id, schema: { type: integer, minimum: 1 } }
        - { in: query, name: q, schema: { type: string } }
      responses:
        '200': { description: SKUs, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/SKU' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      operationId: createSKU
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SKUMutationRequest' } } }
      responses:
        '201': { description: SKU created, content: { application/json: { schema: { $ref: '#/components/schemas/SKU' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /skus/{sku_id}:
    parameters: [ { $ref: '#/components/parameters/SKUID' } ]
    get:
      operationId: getSKU
      responses:
        '200': { description: SKU, content: { application/json: { schema: { $ref: '#/components/schemas/SKU' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    patch:
      operationId: updateSKU
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SKUMutationRequest' } } }
      responses:
        '200': { description: SKU updated, content: { application/json: { schema: { $ref: '#/components/schemas/SKU' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      operationId: deleteSKU
      description: Deletes an unreferenced SKU. SKU records with inventory, media, model-family, AI, or published-content history must be disabled instead.
      responses:
        '204': { description: SKU deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: SKU is referenced by business history, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /skus/{sku_id}/inventory-adjustments:
    parameters: [ { $ref: '#/components/parameters/SKUID' } ]
    post:
      operationId: createInventoryAdjustment
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateInventoryAdjustmentRequest' } } }
      responses:
        '201': { description: Inventory adjustment created, content: { application/json: { schema: { $ref: '#/components/schemas/InventoryAdjustment' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /skus/{sku_id}/inventory-history:
    parameters: [ { $ref: '#/components/parameters/SKUID' } ]
    get:
      operationId: listInventoryHistory
      responses:
        '200': { description: Inventory history, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/InventoryAdjustment' } } } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /capture-sops:
    post:
      operationId: createCaptureSOP
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateCaptureSOPRequest' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/SOPVersion' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    get:
      operationId: listCaptureSOPs
      parameters:
        - { in: query, name: category_id, schema: { type: integer, minimum: 1 } }
        - { in: query, name: include_all, description: "Operational lifecycle listing (super_admin/admin/operator). When true, includes draft-only and archived-only SOPs and every ordered version. Defaults to published-only selection semantics.", schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Capture SOPs
          content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/CaptureSOPSummary' } } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /model-families:
    get:
      operationId: listModelFamilies
      responses:
        '200': { description: Model families, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/ModelFamily' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      operationId: createModelFamily
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateModelFamilyRequest' } } }
      responses:
        '201': { description: Model family created, content: { application/json: { schema: { $ref: '#/components/schemas/ModelFamily' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /model-families/{family_id}:
    parameters: [ { $ref: '#/components/parameters/ModelFamilyID' } ]
    get:
      operationId: getModelFamily
      responses:
        '200': { description: Model family, content: { application/json: { schema: { $ref: '#/components/schemas/ModelFamily' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    patch:
      operationId: updateModelFamily
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateModelFamilyRequest' } } }
      responses:
        '200': { description: Model family updated, content: { application/json: { schema: { $ref: '#/components/schemas/ModelFamily' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /model-families/{family_id}/members:
    parameters: [ { $ref: '#/components/parameters/ModelFamilyID' } ]
    post:
      operationId: addModelFamilyMember
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AddModelFamilyMemberRequest' } } }
      responses:
        '201': { description: Member added, content: { application/json: { schema: { $ref: '#/components/schemas/ModelFamilyMember' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /model-families/{family_id}/reference-assets:
    parameters: [ { $ref: '#/components/parameters/ModelFamilyID' } ]
    get:
      operationId: listModelFamilyReferenceAssets
      responses:
        '200': { description: Approved same-family structural derivatives, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/ModelFamilyReferenceAsset' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createModelFamilyReferenceAsset
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [asset_id, role, forbidden_identity_mask]
              properties:
                asset_id: { type: string, format: uuid }
                role: { type: string, enum: [geometry_only, viewpoint_only, detail_geometry] }
                forbidden_identity_mask: { type: string, format: binary, description: Transparent pixels cover identity attributes that must not be inherited. }
      responses:
        '201': { description: Approved private grayscale structural derivative, content: { application/json: { schema: { $ref: '#/components/schemas/ModelFamilyReferenceAsset' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Source is not an approved real asset in the same model family, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /model-families/{family_id}/reference-assets/{reference_id}:
    parameters:
      - { $ref: '#/components/parameters/ModelFamilyID' }
      - { in: path, name: reference_id, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: revokeModelFamilyReferenceAsset
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RevokeReferenceRequest' } } } }
      responses:
        '200': { description: Revoked for future jobs; historical snapshots remain executable., content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /model-families/{family_id}/members/{member_id}:
    parameters: [ { $ref: '#/components/parameters/ModelFamilyID' }, { $ref: '#/components/parameters/ModelFamilyMemberID' } ]
    delete:
      operationId: removeModelFamilyMember
      responses:
        '204': { description: Member removed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /skus/{sku_id}/variant-identity:
    parameters: [ { $ref: '#/components/parameters/SKUID' } ]
    get:
      operationId: getSKUVariantIdentity
      responses:
        '200': { description: Published target-SKU identity facts, content: { application/json: { schema: { $ref: '#/components/schemas/VariantIdentityManifestVersion' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /skus/{sku_id}/variant-identity/versions:
    parameters: [ { $ref: '#/components/parameters/SKUID' } ]
    post:
      operationId: createSKUVariantIdentityVersion
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateVariantIdentityVersionRequest' } } }
      responses:
        '201': { description: Draft variant identity version, content: { application/json: { schema: { $ref: '#/components/schemas/VariantIdentityManifestVersion' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /variant-identity-versions/{version_id}:
    parameters: [ { $ref: '#/components/parameters/VariantIdentityVersionID' } ]
    patch:
      operationId: updateVariantIdentityVersion
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateVariantIdentityVersionRequest' } } }
      responses:
        '200': { description: Updated draft variant identity version, content: { application/json: { schema: { $ref: '#/components/schemas/VariantIdentityManifestVersion' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /variant-identity-versions/{version_id}/validate:
    parameters: [ { $ref: '#/components/parameters/VariantIdentityVersionID' } ]
    post:
      operationId: validateVariantIdentityVersion
      responses:
        '200': { description: Validation result, content: { application/json: { schema: { $ref: '#/components/schemas/VariantIdentityValidationResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /variant-identity-versions/{version_id}/publish:
    parameters: [ { $ref: '#/components/parameters/VariantIdentityVersionID' } ]
    post:
      operationId: publishVariantIdentityVersion
      responses:
        '200': { description: Published immutable variant identity version, content: { application/json: { schema: { $ref: '#/components/schemas/VariantIdentityManifestVersion' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/VariantIdentityValidationFailed' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /capture-sops/{sop_id}:
    parameters: [ { $ref: '#/components/parameters/SOPID' } ]
    get:
      operationId: getCaptureSOP
      responses:
        '200': { description: Capture SOP, content: { application/json: { schema: { $ref: '#/components/schemas/CaptureSOPSummary' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /capture-sops/{sop_id}/versions:
    parameters: [ { $ref: '#/components/parameters/SOPID' } ]
    post:
      operationId: copySOPVersion
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [source_version_id], properties: { source_version_id: { type: string, format: uuid } } } } }
      responses:
        '201': { description: Copied draft, content: { application/json: { schema: { $ref: '#/components/schemas/SOPVersion' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /sop-versions/{version_id}:
    parameters: [ { $ref: '#/components/parameters/VersionID' } ]
    get:
      operationId: getSOPVersion
      responses:
        '200': { description: SOP version, content: { application/json: { schema: { $ref: '#/components/schemas/SOPVersion' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    patch:
      operationId: updateSOPVersion
      parameters: [ { $ref: '#/components/parameters/SOPRevision' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/VersionMetadataRequest' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/SOPVersion' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /sop-versions/{version_id}/views:
    parameters: [ { $ref: '#/components/parameters/VersionID' } ]
    post:
      operationId: addSOPView
      parameters: [ { $ref: '#/components/parameters/SOPRevision' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AddViewRequest' } } }
      responses:
        '201': { description: View added, content: { application/json: { schema: { $ref: '#/components/schemas/SOPVersion' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /sop-versions/{version_id}/views/{view_id}:
    parameters: [ { $ref: '#/components/parameters/VersionID' }, { $ref: '#/components/parameters/ViewID' } ]
    patch:
      operationId: updateSOPView
      parameters: [ { $ref: '#/components/parameters/SOPRevision' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ViewMutation' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/SOPVersion' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      operationId: deleteSOPView
      parameters: [ { $ref: '#/components/parameters/SOPRevision' } ]
      responses:
        '200': { description: Deleted, content: { application/json: { schema: { $ref: '#/components/schemas/SOPVersion' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /sop-versions/{version_id}/view-order:
    parameters: [ { $ref: '#/components/parameters/VersionID' } ]
    put:
      operationId: reorderSOPViews
      parameters: [ { $ref: '#/components/parameters/SOPRevision' } ]
      requestBody: { $ref: '#/components/requestBodies/UUIDOrder' }
      responses:
